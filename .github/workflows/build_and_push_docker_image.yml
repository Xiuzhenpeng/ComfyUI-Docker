name: Build and Push ComfyUI Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: false
          ref: ${{ github.event.inputs.branch }}

      # 2. Update submodules
      - name: Update submodules
        run: |
          git submodule update --init --recursive

      # 3. Download HuggingFace models
      - name: Download Depth-Anything-V2-Large model
        run: |
          # Download Depth-Anything-V2-Large
          mkdir -p custom_nodes/comfyui_controlnet_aux/ckpts/depth-anything/Depth-Anything-V2-Large
          wget -O custom_nodes/comfyui_controlnet_aux/ckpts/depth-anything/Depth-Anything-V2-Large/depth_anything_v2_vitl.pth \
            https://huggingface.co/depth-anything/Depth-Anything-V2-Large/resolve/main/depth_anything_v2_vitl.pth

          # Download lllyasviel Annotators sk_model.pth and sk_model2.pth for Realistic Lineart
          mkdir -p custom_nodes/comfyui_controlnet_aux/ckpts/lllyasviel/Annotators/
          wget -O custom_nodes/comfyui_controlnet_aux/ckpts/lllyasviel/Annotators/sk_model.pth \
            https://huggingface.co/lllyasviel/Annotators/resolve/main/sk_model.pth?download=true
          wget -O custom_nodes/comfyui_controlnet_aux/ckpts/lllyasviel/Annotators/sk_model2.pth \
            https://huggingface.co/lllyasviel/Annotators/resolve/main/sk_model2.pth?download=true

          # Download lllyasviel Annotators ControlNetHED.pth for HEDPreprocessor
          wget -O custom_nodes/comfyui_controlnet_aux/ckpts/lllyasviel/Annotators/ControlNetHED.pth \
            https://huggingface.co/lllyasviel/Annotators/resolve/main/ControlNetHED.pth?download=true

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        run: |
          echo "Using Docker Hub for login"
          docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_PASSWORD }}

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t xiuzhenpeng/comfyui:${{ github.event.inputs.tag || 'latest' }} .

      # 6. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          echo "Pushing to Docker Hub"
          docker push xiuzhenpeng/comfyui:${{ github.event.inputs.tag || 'latest' }}
