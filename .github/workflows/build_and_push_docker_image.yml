name: Build and Push ComfyUI Docker

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'
      registry:
        description: 'Registry URL (e.g., http://<public-ip>:<port>)'
        required: false
        default: ''  # 默认使用 Docker Hub
      project:
        description: 'Project name for custom registry (e.g., "myproject")'
        required: true  # 强制要求输入项目名
        default: 'comfyui'  # 默认值为 "comfyui" 可以根据需要修改

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout 仓库
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: false  # 先不自动处理子模块，我们手动控制
          ref: ${{ github.event.inputs.branch }}
      
      # 2️⃣ 更新子模块
      - name: Update submodules
        run: |
          git submodule update --init --recursive

      # 3️⃣ 下载 HuggingFace 模型
      - name: Download Depth-Anything-V2-Large model
        run: |
          # 下载 Depth-Anything-V2-Large
          mkdir -p custom_nodes/comfyui_controlnet_aux/ckpts/depth-anything/Depth-Anything-V2-Large
          wget -O custom_nodes/comfyui_controlnet_aux/ckpts/depth-anything/Depth-Anything-V2-Large/depth_anything_v2_vitl.pth \
            https://huggingface.co/depth-anything/Depth-Anything-V2-Large/resolve/main/depth_anything_v2_vitl.pth

          # 下载 lllyasviel Annotators sk_model.pth和sk_model2.pth, for Realistic Lineart
          mkdir -p custom_nodes/comfyui_controlnet_aux/ckpts/lllyasviel/Annotators/
          wget -O custom_nodes/comfyui_controlnet_aux/ckpts/lllyasviel/Annotators/sk_model.pth \
            https://huggingface.co/lllyasviel/Annotators/resolve/main/sk_model.pth?download=true
          wget -O custom_nodes/comfyui_controlnet_aux/ckpts/lllyasviel/Annotators/sk_model2.pth \
            https://huggingface.co/lllyasviel/Annotators/resolve/main/sk_model2.pth?download=true

          # 下载 lllyasviel Annotators ControlNetHED.pth, for HEDPreprocessor
          wget -O custom_nodes/comfyui_controlnet_aux/ckpts/lllyasviel/Annotators/ControlNetHED.pth \
            https://huggingface.co/lllyasviel/Annotators/resolve/main/ControlNetHED.pth?download=true

      # 4️⃣ 修改 Docker 配置, 登录 Docker Hub 或自定义 Registry
      - name: Configure Docker to allow HTTP registry
        run: |
          echo '{"insecure-registries":["118.191.0.226:8040"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl daemon-reload
          sudo systemctl restart docker
          
      - name: Log in to Docker registry
        run: |
          if [ -z "${{ github.event.inputs.registry }}" ]; then
            echo "Using Docker Hub for login"
            docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_PASSWORD }}
          else
            echo "Using custom registry: ${{ github.event.inputs.registry }}"
            docker login ${{ github.event.inputs.registry }} -u ${{ secrets.DOCKER_REGISTRY_USERNAME }} -p ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          fi

      # 5️⃣ 构建 Docker 镜像
      - name: Build Docker image
        run: |
          docker build -t xiuzhenpeng/comfyui:${{ github.event.inputs.tag || 'latest' }} .

      # 6️⃣ 推送 Docker 镜像到指定的 Registry
      - name: Push Docker image
        run: |
          if [ -z "${{ github.event.inputs.registry }}" ]; then
            echo "Pushing to Docker Hub"
            docker push xiuzhenpeng/comfyui:${{ github.event.inputs.tag || 'latest' }}
          else
            echo "Pushing to custom registry: ${{ github.event.inputs.registry }}"
            docker tag xiuzhenpeng/comfyui:${{ github.event.inputs.tag || 'latest' }} ${{ github.event.inputs.registry }}/${{ github.event.inputs.project }}/comfyui:${{ github.event.inputs.tag || 'latest' }}
            docker push ${{ github.event.inputs.registry }}/${{ github.event.inputs.project }}/comfyui:${{ github.event.inputs.tag || 'latest' }}
          fi
